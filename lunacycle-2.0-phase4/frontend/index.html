<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg"><meta name="theme-color" content="#7b4b94"><title>LunaCycle</title>
<style>
:root{--bg:#f6f3ee;--card:#fffdf9;--ink:#23213a;--mute:#7a7690;--line:#e8e2d8;--accent:#7b4b94;--soft:#f1e6f5;--flow:#d9576b;--peach:#e88fa8;--ok:#4aa58a;--shadow:0 6px 24px rgba(40,30,90,.07);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17121f;--card:#221a2e;--ink:#ece9fb;--mute:#9a96b8;--line:#3a2f4a;--accent:#c9a0e0;--soft:#3a2a4a;--flow:#ef7a8c;--shadow:none}}
:root[data-theme="dark"]{--bg:#17121f;--card:#221a2e;--ink:#ece9fb;--mute:#9a96b8;--line:#3a2f4a;--accent:#c9a0e0;--soft:#3a2a4a;--flow:#ef7a8c;--shadow:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:600;margin:0 0 .4em}h1{font-size:1.9rem}h2{font-size:1.2rem}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav a{flex:1;text-align:center;padding:8px 2px;font-size:.62rem;color:var(--mute);text-decoration:none}nav a b{display:block;font-size:1.2rem;font-weight:400}
nav a.on{color:var(--accent);font-weight:600}.brand{display:none}
main{max-width:980px;margin:0 auto;padding:18px 16px 96px;animation:in .35s ease}@keyframes in{from{opacity:0;transform:translateY(6px)}}
@media(min-width:860px){nav{top:0;bottom:auto;width:210px;flex-direction:column;border:0;border-right:1px solid var(--line);padding:22px 12px}
nav a{text-align:left;font-size:.95rem;padding:10px 14px;border-radius:12px;margin-bottom:4px}nav a b{display:inline;margin-right:10px;font-size:1.05rem}nav a.on{background:var(--soft)}
.brand{display:block;font:600 1.4rem Georgia,serif;padding:0 14px 18px;color:var(--accent)}main{margin-left:210px;max-width:none;padding:28px 36px 40px}}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow)}
.big{font:600 3rem/1 Georgia,serif;color:var(--accent)}.mute{color:var(--mute);font-size:.88rem}.note{font-size:.78rem;color:var(--mute);margin-top:8px}
.chip{display:inline-block;padding:5px 12px;margin:3px 4px 3px 0;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:.85rem;cursor:pointer}
.chip.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
button.p{background:var(--accent);color:var(--bg);border:0;border-radius:12px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer}button.g{background:none;border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:10px 16px;font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--peach);outline-offset:2px}
input,textarea,select{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}label{display:block;margin:12px 0 4px;font-size:.85rem;color:var(--mute)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.cal .h{text-align:center;font-size:.72rem;color:var(--mute)}
.day{aspect-ratio:1;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:.85rem;position:relative;cursor:pointer;padding:0}
.day.flow{background:var(--flow);color:#fff;border-color:var(--flow)}.day.pred{border:2px dashed var(--flow)}.day.today{box-shadow:0 0 0 2px var(--accent)}.day.sel{outline:3px solid var(--peach)}
.dots{position:absolute;bottom:3px;left:0;right:0;display:flex;justify-content:center;gap:2px}.dots i{width:5px;height:5px;border-radius:50%}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.hb{display:grid;grid-template-columns:110px 1fr 28px;gap:8px;align-items:center;font-size:.85rem;margin:6px 0}.hb u{display:block;height:10px;border-radius:6px;background:var(--soft)}.hb u i{display:block;height:100%;border-radius:6px;background:var(--accent)}
.msg{padding:12px 14px;border-radius:16px;margin:10px 0;background:var(--soft);white-space:pre-wrap}.msg.me{background:var(--accent);color:var(--bg);margin-left:20%}
.tag{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
svg text{fill:var(--mute);font-size:9px}
@media(prefers-reduced-motion:reduce){main{animation:none}}
@media print{nav,button,select,.chip{display:none!important}main{margin:0!important;padding:0!important}body{background:#fff;color:#000}.card{box-shadow:none;break-inside:avoid}}
table{width:100%;border-collapse:collapse;font-size:.85rem}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line)}.wrap{overflow-x:auto}.admbar{background:#3b2150;color:#fff;border-radius:14px;padding:12px 16px;margin-bottom:14px;font-size:.88rem}.adm main{background:linear-gradient(#f3ecf7,transparent 240px)}.hero{padding:34px 22px;text-align:center}.hero h1{font-size:2.3rem}

/* ===== Phase 3 visual refresh ===== */
:root{--grad:linear-gradient(135deg,var(--accent),#b86bb5);--glass:color-mix(in srgb,var(--card) 80%,transparent);--r:24px}
body{background:radial-gradient(900px 520px at 6% -6%,color-mix(in srgb,var(--accent) 15%,transparent),transparent 62%),radial-gradient(700px 420px at 100% 0,color-mix(in srgb,var(--peach) 18%,transparent),transparent 60%),var(--bg);background-attachment:fixed;letter-spacing:.005em}
h1{font-size:2.05rem;letter-spacing:-.01em}h2{letter-spacing:-.005em}
.card{border-radius:var(--r);box-shadow:0 1px 2px rgba(60,30,90,.05),0 12px 32px -14px rgba(90,50,130,.22);transition:transform .25s ease,box-shadow .25s ease}
@media(hover:hover){.grid>.card:hover{transform:translateY(-3px);box-shadow:0 2px 4px rgba(60,30,90,.06),0 20px 40px -16px rgba(90,50,130,.32)}}
.big{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
nav{background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
nav a b{display:flex;justify-content:center;margin-bottom:2px}nav a svg{display:block}
.brand{align-items:center;gap:10px}@media(min-width:860px){.brand{display:flex}nav a{display:flex;align-items:center;gap:12px}nav a b{margin:0}nav a.on{background:var(--grad);color:#fff;box-shadow:0 8px 18px -8px var(--accent)}}
nav a.on{font-weight:600}
button.p{background:var(--grad);border-radius:999px;padding:11px 22px;box-shadow:0 10px 22px -10px var(--accent);transition:transform .15s,box-shadow .15s}
button.p:hover{transform:translateY(-1px);box-shadow:0 14px 26px -10px var(--accent)}button.p:active{transform:none}
button.g{border-radius:999px;transition:background .15s}button.g:hover{background:var(--soft)}
.chip{transition:all .15s}.chip:hover{border-color:var(--accent)}.chip.on{background:var(--grad);border-color:transparent;color:#fff}
input,textarea,select{border-radius:14px;transition:border-color .15s,box-shadow .15s}input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent);outline:none}
.day{border-radius:14px;transition:transform .12s,background .15s}.day:hover{transform:scale(1.06);background:var(--soft)}.day.flow{background:linear-gradient(135deg,#e8788f,#d9576b)}.day.today{box-shadow:0 0 0 2px var(--accent)}
.hb u{height:12px}.hb u i{background:var(--grad)}
.msg{border-radius:18px 18px 18px 6px}.msg.me{background:var(--grad);border-radius:18px 18px 6px 18px}
.hero{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 16%,var(--card)),color-mix(in srgb,var(--peach) 20%,var(--card)));position:relative;overflow:hidden;padding:46px 24px}
.hero::after{content:"";position:absolute;right:-30px;top:-30px;width:170px;height:170px;border-radius:50%;box-shadow:-30px 14px 0 0 color-mix(in srgb,var(--accent) 26%,transparent)}
.hero h1{font-size:clamp(2rem,5vw,3rem);line-height:1.1;position:relative}.hero p,.hero button{position:relative}
.tag{display:inline-block;padding:3px 12px;border-radius:99px;background:var(--soft)}
.sk{height:14px;border-radius:8px;background:linear-gradient(90deg,var(--soft),var(--line),var(--soft));background-size:200% 100%;animation:sh 1.2s infinite}@keyframes sh{to{background-position:-200% 0}}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;box-shadow:0 12px 30px -8px rgba(0,0,0,.4);z-index:20;max-width:90vw;animation:in .3s ease}
.toast.err{background:var(--flow);color:#fff}@media(min-width:860px){.toast{bottom:28px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== Phase 4: playful motion ===== */
body::before,body::after{content:"";position:fixed;z-index:-1;border-radius:50%;pointer-events:none;animation:float 20s ease-in-out infinite alternate}
body::before{width:48vmax;height:48vmax;left:-16vmax;top:-20vmax;background:radial-gradient(closest-side,color-mix(in srgb,var(--accent) 22%,transparent),transparent)}
body::after{width:42vmax;height:42vmax;right:-14vmax;bottom:-16vmax;background:radial-gradient(closest-side,color-mix(in srgb,var(--peach) 26%,transparent),transparent);animation-delay:-8s}
@keyframes float{to{transform:translate(4vmax,3vmax) scale(1.08)}}
.grid>.card{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}.grid>.card:nth-child(2){animation-delay:.06s}.grid>.card:nth-child(3){animation-delay:.12s}.grid>.card:nth-child(4){animation-delay:.18s}.grid>.card:nth-child(n+5){animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.98)}}
.dial{display:block;margin:6px auto;animation:pop .9s cubic-bezier(.2,1.3,.4,1) both;filter:drop-shadow(0 12px 20px color-mix(in srgb,var(--accent) 28%,transparent))}
@keyframes pop{from{opacity:0;transform:scale(.78) rotate(-30deg)}}
button:active,.chip:active,.day:active{transform:scale(.92)!important}
.card:has(.dial){text-align:center}
</style></head><body>
<nav id="nav"></nav><main id="app"></main>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const D0=s=>new Date(s+'T00:00:00'),iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const add=(s,n)=>{const d=D0(s);d.setDate(d.getDate()+n);return iso(d)},diff=(a,b)=>Math.round((D0(a)-D0(b))/864e5),today=()=>iso(new Date());
const fmt=(s,o={month:'short',day:'numeric'})=>D0(s).toLocaleDateString(LOC,o);
const mean=a=>a.reduce((x,y)=>x+y,0)/a.length;
const blank=()=>({logs:{},journal:{},set:{name:'',cycle:28,period:5,theme:'system',ai:false,remPeriod:true,remDaily:false,remCustom:''},chat:[]});
let USER=null,S=blank(),mode='login';
const save=()=>{};
async function api(p,b){const r=await fetch(p,{method:b?'POST':'GET',headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined,credentials:'same-origin'});const j=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error((j.details&&j.details[0]&&j.details[0].message)||j.error||'Request failed'),{status:r.status});return j}
const tryApi=async f=>{try{await f()}catch(e){toast(e.message,'err');if(e.status===401&&USER){USER=null;render()}}};
async function loadAll(){const d=await api('/api/data');USER=d.user;DEV=!!d.dev;S={...blank(),set:d.set,logs:d.logs,journal:d.journal,chat:S.chat||[]};theme()}

const theme=()=>{const t=S.set.theme;t==='system'?document.documentElement.removeAttribute('data-theme'):document.documentElement.setAttribute('data-theme',t)};
const SYM=['Cramps','Headache','Bloating','Breast tenderness','Fatigue','Mood changes','Back pain','Acne'],MOODS=['Calm','Happy','Energised','Anxious','Irritable','Low'],FLOW=['None','Spotting','Light','Medium','Heavy'];
// ---------- data & prediction ----------
function periods(){const ds=Object.keys(S.logs).filter(d=>S.logs[d].flow>0).sort(),o=[];for(const d of ds){const l=o[o.length-1];if(l&&diff(d,l.end)<=2)l.end=d;else o.push({start:d,end:d})}o.forEach(p=>p.len=diff(p.end,p.start)+1);return o}
function stats(){const P=periods(),lens=[];for(let i=1;i<P.length;i++)lens.push(diff(P[i].start,P[i-1].start));const L=lens.slice(-6),avg=L.length?mean(L):+S.set.cycle,sd=L.length>1?Math.sqrt(mean(L.map(x=>(x-avg)**2))):0;
return{P,lens,L,avg,sd,pl:P.length?mean(P.map(p=>p.len)):+S.set.period,last:P.length?P[P.length-1].start:null}}
function predict(st){if(!st.last)return null;const sp=st.L.length>1?Math.max(1,Math.round(st.sd)):3,c=add(st.last,Math.round(st.avg));return{from:add(c,-sp),to:add(c,sp),c,sp}}
function ctx(date,st){let s=null,i=-1;st.P.forEach((p,k)=>{if(p.start<=date){s=p.start;i=k}});if(!s)return null;const nx=st.P[i+1],len=nx?diff(nx.start,s):Math.round(st.avg);return{day:diff(date,s)+1,len}}
function phase(day,st){const ov=Math.round(st.avg)-14,pl=Math.round(st.pl);if(day<=pl)return['Menstrual','Your recorded period days.'];if(day<ov-2)return['Follicular','Estimated: between your period and ovulation.'];if(day<=ov+1)return['Ovulation window','Estimated window only; it can vary a lot.'];return['Luteal','Estimated: after the ovulation window, before next period.']}
function patterns(st){const m={};for(const d in S.logs)(S.logs[d].symptoms||[]).forEach(s=>{const c=ctx(d,st);if(c)(m[s]=m[s]||[]).push({f:(c.day-1)/c.len,day:c.day})});
return Object.entries(m).filter(([,a])=>a.length>=3).map(([s,a])=>{const f=mean(a.map(x=>x.f)),w=f<.25?'around the start of your cycle':f<.6?'in the middle part of your cycle':'during the later part of your cycle';return{s,n:a.length,day:Math.round(mean(a.map(x=>x.day))),text:`Based on your previous records, you commonly logged ${s.toLowerCase()} ${w} (${a.length} entries, around day ${Math.round(mean(a.map(x=>x.day)))}).`}})}
function seed(){const lens=[28,30,27,29,31,28,29];let s=add(today(),-9-lens.reduce((a,b)=>a+b,0)+0);S.logs={};const flows=[2,3,4,3,1],pick=(i,n)=>(i*7+3)%n;
let starts=[s];lens.forEach(l=>{starts.push(add(starts[starts.length-1],l))});
starts.forEach((st,ci)=>{const len=lens[ci]||29;for(let d=0;d<len&&add(st,d)<=today();d++){const date=add(st,d),L=S.logs[date]={symptoms:[]};
if(d<5)L.flow=flows[d];if(d<2)L.symptoms.push('Cramps');if(d===0&&ci%2)L.symptoms.push('Back pain');if(d>=len-5&&d<len-1)L.symptoms.push('Fatigue');if(d>=len-6&&d<len-3&&ci%3!==1)L.symptoms.push('Bloating');if((d+ci)%11===0)L.symptoms.push('Headache');
L.mood=d<5?['Low','Calm','Irritable'][pick(d+ci,3)]:d>len-6?['Irritable','Anxious','Low'][pick(d+ci,3)]:['Happy','Energised','Calm'][pick(d+ci,3)];
L.energy=d<3?2:d<12?4:d>len-6?2:3+(d+ci)%2;L.sleep=+(6+((d*5+ci)%9)/4).toFixed(1);if(!L.symptoms.length)delete L.symptoms}});
S.set.name=S.set.name||'Sample';S.journal[add(today(),-2)]='Felt tired by evening but a walk helped. Early night planned.';save()}
// ---------- charts ----------
const bars=(v,l)=>{const m=Math.max(...v,1),w=300/v.length;return`<svg viewBox="0 0 300 130" role="img" aria-label="Bar chart">${v.map((x,i)=>{const h=x/m*85;return`<rect x="${i*w+w*.15}" y="${105-h}" width="${w*.7}" height="${h}" rx="5" fill="var(--accent)"/><text x="${i*w+w/2}" y="${100-h}" text-anchor="middle">${x}</text><text x="${i*w+w/2}" y="122" text-anchor="middle">${l[i]}</text>`}).join('')}</svg>`};
const line=v=>{if(v.length<2)return'<p class="mute">Log energy on a few days to see a trend.</p>';const w=300/(v.length-1),pts=v.map((x,i)=>`${i*w},${100-(x-1)/4*90}`).join(' ');return`<svg viewBox="-6 0 312 110" role="img" aria-label="Energy trend"><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>${v.map((x,i)=>`<circle cx="${i*w}" cy="${100-(x-1)/4*90}" r="2.5" fill="var(--peach)"/>`).join('')}</svg>`};
const hb=m=>{const e=Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,8),mx=e.length?e[0][1]:1;return e.length?e.map(([k,n])=>`<div class="hb"><span>${esc(k)}</span><u><i style="width:${n/mx*100}%"></i></u><b>${n}</b></div>`).join(''):'<p class="mute">Nothing logged yet.</p>'};
// ---------- editor ----------
let sel=today(),dr=null,drFor=null,mo=0;
const chips=(arr,cur,fn)=>arr.map(x=>`<button class="chip ${cur&&cur.includes(x)?'on':''}" onclick="${fn}('${x}')" aria-pressed="${!!(cur&&cur.includes(x))}">${x}</button>`).join('');
function editor(){if(drFor!==sel){dr=JSON.parse(JSON.stringify(S.logs[sel]||{}));drFor=sel}const d=dr,sy=d.symptoms||[],custom=sy.filter(x=>!SYM.includes(x));
return`<div class="card"><h2>${fmt(sel,{weekday:'long',month:'long',day:'numeric'})}</h2>
<label>Period flow</label>${FLOW.map((f,i)=>`<button class="chip ${(d.flow||0)===i?'on':''}" onclick="setF(${i})">${f}</button>`).join('')}
<label>Symptoms <span class="mute">(personal tracking, not a diagnosis)</span></label>${chips([...SYM,...custom],sy,'tg')}
<div class="row" style="margin-top:6px"><input id="cs" placeholder="Add a custom symptom" maxlength="40" style="flex:1"><button class="g" onclick="addC()">Add</button></div>
<label>Mood</label>${MOODS.map(x=>`<button class="chip ${d.mood===x?'on':''}" onclick="setM('${x}')">${x}</button>`).join('')}
<label>Energy (1 low – 5 high)</label>${[1,2,3,4,5].map(i=>`<button class="chip ${d.energy===i?'on':''}" onclick="setE(${i})">${i}</button>`).join('')}
<label>Sleep (hours)</label><input id="sl" type="number" min="0" max="24" step="0.5" value="${d.sleep??''}" style="max-width:140px">
<label>Notes</label><textarea id="nt" rows="3" maxlength="2000">${esc(d.note||'')}</textarea>
<div class="row" style="margin-top:14px"><button class="p" onclick="saveD()">Save entry</button>${S.logs[sel]?'<button class="g" onclick="delD()">Delete entry</button>':''}</div></div>`}
const keep=()=>{if(dr){const s=$('#sl'),n=$('#nt');if(s)dr.sleep=s.value===''?undefined:Math.min(24,Math.max(0,+s.value));if(n)dr.note=n.value}};
const setF=i=>{keep();dr.flow=i;render()},tg=x=>{keep();const a=dr.symptoms=dr.symptoms||[];a.includes(x)?a.splice(a.indexOf(x),1):a.push(x);render()},setM=x=>{keep();dr.mood=dr.mood===x?undefined:x;render()},setE=i=>{keep();dr.energy=dr.energy===i?undefined:i;render()};
const addC=()=>{keep();const v=$('#cs').value.trim().slice(0,40);if(v){dr.symptoms=dr.symptoms||[];if(!dr.symptoms.includes(v))dr.symptoms.push(v)}render()};
const saveD=()=>{keep();const c={};for(const k in dr)if(dr[k]!==undefined&&dr[k]!==''&&!(Array.isArray(dr[k])&&!dr[k].length)&&!(k==='flow'&&!dr[k]))c[k]=dr[k];tryApi(async()=>{if(Object.keys(c).length){await api('/api/logs',{logs:[{date:sel,...c}]});S.logs[sel]=c}else{await api('/api/logs/delete',{date:sel});delete S.logs[sel]}drFor=null;render()})};
const delD=()=>{if(confirm('Delete this day\u2019s entry?'))tryApi(async()=>{await api('/api/logs/delete',{date:sel});delete S.logs[sel];drFor=null;render()})};
const pick=d=>{sel=d;drFor=null;render()};
// ---------- views ----------
const V={};
V.dashboard=()=>{const st=stats(),t=today();

V.calendar=()=>{const st=stats(),pr=predict(st),b=new Date();b.setDate(1);b.setMonth(b.getMonth()+mo);const y=b.getFullYear(),m=b.getMonth(),first=(new Date(y,m,1).getDay()-P.wk+7)%7,n=new Date(y,m+1,0).getDate(),t=today();
let h='';for(let i=0;i<first;i++)h+='<div></div>';for(let d=1;d<=n;d++){const ds=iso(new Date(y,m,d)),l=S.logs[ds]||{},p=pr&&ds>=pr.from&&ds<=add(pr.to,Math.round(st.pl)-1)&&ds>t;

return`<div class="row"><h1>Calendar</h1><div><button class="g" onclick="mo--;render()" aria-label="Previous month">‹</button> <b>${b.toLocaleDateString(LOC,{month:'long',year:'numeric'})}</b> <button class="g" onclick="mo++;render()" aria-label="Next month">›</button></div></div>
<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))"><div class="card"><div class="cal">${[0,1,2,3,4,5,6].map(i=>`<div class="h">${new Date(2024,0,7+(i+P.wk)%7).toLocaleDateString(LOC,{weekday:'narrow'})}</div>`).join('')}${h}</div><p class="note"><span style="color:var(--flow)">■</span> period · dashed = estimated range · <span style="color:var(--peach)">●</span> symptoms · <span style="color:var(--accent)">●</span> mood · <span style="color:var(--ok)">●</span> sleep · <span>●</span> journal</p></div>${editor()}</div>`};
V.track=()=>{sel=sel||today();return`<h1>Track</h1><p class="mute">Pick a different day in the Calendar, or log today here.</p>${editor()}`};
V.insights=()=>{const st=stats(),pt=patterns(st),sym={},mood={},en=[];Object.keys(S.logs).sort().forEach(d=>{const l=S.logs[d];(l.symptoms||[]).forEach(s=>sym[s]=(sym[s]||0)+1);if(l.mood)mood[l.mood]=(mood[l.mood]||0)+1;if(l.energy)en.push(l.energy)});

return`<div class="row"><h1>Insights</h1><button class="g" onclick="window.print()">Print summary</button></div><div class="grid"><div class="card"><div class="mute">Average cycle</div><div class="big">${st.L.length?st.avg.toFixed(1):'—'}</div><div class="note">days (last ${st.L.length})</div></div><div class="card"><div class="mute">Average period</div><div class="big">${st.P.length?st.pl.toFixed(1):'—'}</div><div class="note">days</div></div><div class="card"><div class="mute">Variability</div><div class="big">${st.L.length>1?'±'+st.sd.toFixed(1):'—'}</div><div class="note">${st.L.length>1?'range '+Math.min(...st.L)+'–'+Math.max(...st.L)+' days':'needs 2+ cycles'}</div></div></div>
<div class="grid" style="margin-top:14px"><div class="card"><h2>Cycle lengths</h2>${st.lens.length?bars(st.lens.slice(-10),st.lens.slice(-10).map((_,i)=>i+1)):'<p class="mute">Not enough data yet.</p>'}<div class="note">${st.lens.length>3?`Compared with your first 3 recorded cycles, your latest 3 average ${Math.abs(ch).toFixed(1)} days ${ch>=0?'longer':'shorter'}.`:''}</div></div>
<div class="card"><h2>Symptom frequency</h2>${hb(sym)}</div><div class="card"><h2>Mood trends</h2>${hb(mood)}</div><div class="card"><h2>Energy trend</h2>${line(en.slice(-30))}</div></div>
<div class="card" style="margin-top:14px"><div class="tag">Personal Pattern Engine</div><h2>Patterns in your records</h2>${pt.length?pt.map(p=>`<p>${esc(p.text)}</p>`).join(''):'<p class="mute">Log a symptom 3+ times across cycles to reveal patterns.</p>'}<div class="note">These are patterns in what you recorded, not medical conclusions.</div></div>`};
function reply(q){const st=stats(),pt=patterns(st),t=q.toLowerCase(),tr=[],edu=[];let med='';
if(/diagnos|pcos|endometriosis|pregnan|cancer|infection|disease/.test(t)||/severe|fainting|very heavy|soaking|bleeding between|missed|worried/.test(t))med='I can\u2019t diagnose or assess medical conditions. Severe pain, very heavy bleeding, fainting, or big unexplained changes are worth discussing with a qualified healthcare professional.';
const hit=SYM.concat(Object.keys(patterns(st).reduce((a,p)=>(a[p.s]=1,a),{}))).find(s=>t.includes(s.toLowerCase().split(' ')[0]));
if(/last|how long|cycle length|five|5/.test(t)&&/cycle/.test(t)||/how long/.test(t))tr.push(st.lens.length?`Your last ${Math.min(5,st.lens.length)} cycle lengths: ${st.lens.slice(-5).join(', ')} days (average ${st.avg.toFixed(1)}).`:'I need at least two logged periods to measure a cycle length.');
else if(/change|trend|vari|over time/.test(t))tr.push(st.lens.length>3?`Earliest 3 cycles averaged ${mean(st.lens.slice(0,3)).toFixed(1)} days; latest 3 averaged ${mean(st.lens.slice(-3)).toFixed(1)} days. Variability is about ±${st.sd.toFixed(1)} days.`:'Not enough cycles logged to describe change over time yet.');
else if(hit){const p=pt.find(x=>x.s===hit);tr.push(p?p.text:`I don\u2019t have enough logged entries of ${hit.toLowerCase()} to describe a pattern.`)}
else if(/symptom/.test(t)){const c={};Object.values(S.logs).forEach(l=>(l.symptoms||[]).forEach(s=>c[s]=(c[s]||0)+1));const e=Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,5);tr.push(e.length?'Most logged: '+e.map(([k,n])=>`${k} (${n})`).join(', ')+'.':'No symptoms logged yet.');}
else if(/summar|recent|overview/.test(t)){const pr=predict(st);tr.push(st.last?`Logged ${st.P.length} periods; average cycle ${st.avg.toFixed(1)} days, period ${st.pl.toFixed(1)} days. Last period began ${fmt(st.last)}. ${pr?`Next one is estimated around ${fmt(pr.from)}–${fmt(pr.to)}.`:''}`:'Nothing to summarise yet. Log a period first.')}
if(/why|what is|cause|normal|phase|ovulat/.test(t))edu.push('Cycle lengths commonly vary from person to person and month to month. Many people notice changes in energy, mood or sleep across a cycle, but experiences differ widely.');
if(!tr.length&&!edu.length&&!med)tr.push('Try: \u201CHow long were my last five cycles?\u201D, \u201CWhat symptoms did I log most?\u201D, \u201CWhen did I get cramps?\u201D, \u201CHow has my cycle length changed?\u201D or \u201CSummarize my recent data.\u201D');
return[tr.length&&'📒 Your tracking data\n'+tr.join('\n'),edu.length&&'📚 General education\n'+edu.join('\n'),med&&'🩺 Medical advice\n'+med].filter(Boolean).join('\n\n')}

if(!AIS.configured)return`<h1>Luna AI</h1><div class="card"><h2>Cloud assistant not set up</h2><p>The site owner has not connected an AI provider yet, so cloud answers are unavailable. (Owner: set <code>ANTHROPIC_API_KEY</code> on the server.) The on-device assistant below still works and sends nothing anywhere.</p></div>${local}`;
if(!AIS.consent)return`<h1>Luna AI</h1><div class="card"><h2>Before you start</h2><p>To answer questions about your records, Luna AI sends a <b>summary</b> to an AI provider (Anthropic): cycle and period lengths, counts of standard symptoms and moods, and average energy and sleep. It never sends your name, email, notes, journal or custom symptoms. You can withdraw consent at any time. Luna AI is educational, cannot diagnose, and is no substitute for a healthcare professional.</p><button class="p" onclick="setConsent(true)">I agree</button> <button class="g" onclick="go('dashboard')">Not now</button></div>${local}`;
return`<h1>Luna AI</h1><div class="card">${SC.map(m=>`<div class="msg ${m.me?'me':''}">${esc(m.t)}</div>`).join('')||'<p class="mute">Ask about your own records or general cycle education.</p>'}<div class="row" style="margin-top:10px"><input id="aiq" maxlength="500" placeholder="Ask Luna AI…" style="flex:1" onkeydown="if(event.key==='Enter')askS()"><button class="p" onclick="askS()">Send</button></div><p class="note">Educational information, not medical advice. Estimates are not guarantees. <a href="#" onclick="setConsent(false);return false">Withdraw consent</a></p></div>`};
function askS(){const q=$('#aiq').value.trim();if(!q)return;SC.push({me:1,t:q});render();tryApi(async()=>{try{const r=await api('/api/ai/chat',{message:q});SC.push({t:r.reply})}catch(e){SC.push({t:'⚠ '+e.message});if(e.status===401)throw e}render()})}
function render(){const h=location.hash.slice(1),p=h||(USER?'dashboard':'home'),y=scrollY;document.documentElement.lang=P.lang;
if(!USER){const pub=PUB.some(x=>x[0]===p);if(!pub&&p!=='login'&&p!=='signup'&&V[p])NEXT=p;
$('#nav').innerHTML=BRAND+PUB.map(([k,l])=>`<a href="#${k}" class="${k===p?'on':''}">${l}</a>`).join('')+'<a href="#login">Log in</a><a href="#signup">Sign up</a>';
$('#app').innerHTML=(pub?V[p]():authView())+DISC}
else{const v=V[p]&&(p==='pricing'||!PUB.some(x=>x[0]===p))?p:'dashboard';
$('#nav').innerHTML=BRAND+NAV.concat(USER.role==='admin'?[['admin','🛡','Admin']]:[]).map(([k,i,l])=>`<a href="#${k}" class="${k===v?'on':''}"><b>${IC[k]||i}</b>${l}</a>`).join('');
$('#app').innerHTML=vb()+V[v]()+DISC;document.body.classList.toggle('adm',v==='admin')}
tr($('#nav'));tr($('#app'));scrollTo(0,y);countUp()}
const hm=()=>{if(location.hash==='#signup')mode='signup';if(location.hash==='#login')mode='login'};hm();addEventListener('hashchange',()=>{hm();window.scrollTo(0,0);render()});if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});(async()=>{const vt=location.pathname==='/verify-email'&&new URLSearchParams(location.search).get('token');
if(vt){try{await api('/api/auth/verify-email',{token:vt});alert('Email verified. Thank you!')}catch(e){toast(e.message,'err')}history.replaceState(null,'','/')}
try{await loadAll()}catch(e){}theme();render()})();
</script></body></html>
